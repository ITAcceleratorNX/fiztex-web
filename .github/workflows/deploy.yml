name: Deploy frontend

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.2

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck:test
      - run: pnpm test
      - run: pnpm run build

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: dist/

      - name: Upload dist to server
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
        run: |
          set -euo pipefail
          install -m 600 -D /dev/null ~/.ssh/id_ed25519
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Сервер игнорирует "frontend" как команду — forced command в
          # authorized_keys всегда запускает deploy/ci-dispatch.sh, а эта строка
          # лишь выбирает ветку case (см. fiztex-back/deploy/ci-dispatch.sh).
          tar -czf - -C dist . | ssh -i ~/.ssh/id_ed25519 "$SSH_USER@$SSH_HOST" "frontend"
